[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "langchain-text-splitters>=1.1.3",
    "pipecat-ai[cartesia,daily,deepgram,elevenlabs,openai,runner,silero,webrtc]",
    "pipecatcloud",
    "pymupdf4llm>=1.28.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
